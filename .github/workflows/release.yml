# A release: push a tag like v1.0.0 (it has to match PORT_VERSION in src/common.h).
# The program is built with devkitPro, packed as a CIA, and published with a QR
# code that installs the CIA with FBI (Remote Install, Scan QR Code).
# Started by hand (Actions > Release > Run workflow) it only builds: the files
# are in the artifact "release" and nothing is published.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Pinned, not :latest: the image brings the package databases, so no
    # `dkp-pacman -Sy` is needed (the package server answers CI with 403).
    container: devkitpro/devkitarm:20260610
    steps:
      - uses: actions/checkout@v4

      - name: The tag has to be the version of the game
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^#define PORT_VERSION *"\(.*\)".*/\1/p' src/common.h)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME is not v$version (PORT_VERSION in src/common.h)" >&2
            exit 1
          fi

      - name: Libraries
        run: |
          dkp-pacman -S --noconfirm 3ds-sdl 3ds-sdl_image 3ds-sdl_mixer \
            3ds-sdl_ttf 3ds-libpng 3ds-libjpeg-turbo 3ds-zlib 3ds-bzip2 \
            3ds-freetype 3ds-libogg 3ds-libvorbisidec 3ds-libmad 3ds-mikmod
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg

      - name: Build
        run: make -C 3ds

      - name: Test
        run: |
          apt-get install -y --no-install-recommends gcc libsdl1.2-dev \
            libsdl-image1.2-dev libsdl-mixer1.2-dev libsdl-ttf2.0-dev
          make -C tests

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            3ds/zatackax.3dsx
            3ds/zatackax.elf
            3ds/zatackax.smdh
            3ds/romfs-build
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: build
          path: 3ds

      - name: makerom and bannertool
        run: |
          mkdir tools && cd tools
          curl -fsSL -o makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip
          curl -fsSL -o bannertool.tar.gz https://github.com/carstene1ns/3ds-bannertool/releases/download/1.2.3/bannertool-1.2.3-linux.tar.gz
          unzip -q makerom.zip
          tar xzf bannertool.tar.gz
          sudo install -m 755 "$(find . -name makerom -type f | head -1)" /usr/local/bin/makerom
          sudo install -m 755 "$(find . -name bannertool -type f | head -1)" /usr/local/bin/bannertool

      - name: CIA
        run: |
          sh 3ds/tools/make-cia.sh
          mkdir release
          cp 3ds/zatackax.cia release/achtung-die-kurve.cia
          cp 3ds/zatackax.3dsx release/achtung-die-kurve.3dsx

      - name: QR code
        run: |
          python3 -m venv qrenv
          qrenv/bin/pip install segno
          url="https://github.com/${{ github.repository }}/releases/latest/download/achtung-die-kurve.cia"
          qrenv/bin/python -c "import segno, sys; segno.make(sys.argv[1], error='m').save('release/qr-cia.png', scale=10, border=3)" "$url"

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release

      - name: Release notes
        if: github.ref_type == 'tag'
        run: |
          cat > notes.md <<NOTES
          # Achtung, die Kurve! ${GITHUB_REF_NAME}

          A Nintendo 3DS port of Zatacka X.

          ## Install

          **With FBI** (needs custom firmware): open FBI, choose *Remote Install*, then *Scan QR Code*, and scan this:

          ![QR code](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/qr-cia.png)

          The code always leads to the newest release. Or download \`achtung-die-kurve.cia\` and install it with FBI from the SD card.

          **Without installing:** copy \`achtung-die-kurve.3dsx\` to \`sd:/3ds/\` and start it from the Homebrew Launcher.

          Sound needs the DSP firmware dumped from your own console (\`sd:/3ds/dspfirm.cdc\`).

          ## Changes

          NOTES
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          git log ${prev:+$prev..}HEAD --no-merges --pretty='- %s' >> notes.md

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          body_path: notes.md
          files: |
            release/achtung-die-kurve.cia
            release/achtung-die-kurve.3dsx
            release/qr-cia.png
